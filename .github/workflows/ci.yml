name: CI

on:
  # A PR runs once (pull_request); a push to a PR branch would run it twice.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Metal-Rust dependency pin
        run: python3 scripts/check_metal_rust_pin.py
      - name: Linux system libraries (audio, file dialogs, windowing)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - name: Build without libopus (no CMake needed)
        if: runner.os == 'Linux'
        run: cargo check --release --locked --no-default-features -p sixng-cli -p sixng-gui
